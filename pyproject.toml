[project]
name = "kagg-notebook-refactor"
version = "0.1.0"
description = "Kaggriculture diagnostic harness (main.py + agent.py patch over the diagnose package)"
readme = "README.md"
authors = [
    { name = "elrensmin", email = "keenignition@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "kaggle-environments>=1.32.7",
]

# This repo is a collection of runnable scripts (the diagnose package,
# main/agent/route_tape under src/, and package.py), not a wheel to publish.
# Treat it as a non-package project so `uv sync` / `uv run python -m diagnose ...`
# sets up the dependency environment without hunting for a build target.
[tool.uv]
package = false
